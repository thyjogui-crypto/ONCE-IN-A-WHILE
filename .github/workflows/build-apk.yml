name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare persistent signing key
        id: signing
        env:
          KEY_B64: ${{ secrets.ONCE_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ONCE_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ONCE_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ONCE_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KEY_B64" || -n "$STORE_PASSWORD" || -n "$KEY_ALIAS" || -n "$KEY_PASSWORD" ]]; then
            if [[ -z "$KEY_B64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
              echo "::error::Os quatro Secrets de assinatura têm de estar configurados."
              exit 1
            fi
            printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/once-signing.p12"
            echo "ONCE_SIGNING_KEYSTORE=$RUNNER_TEMP/once-signing.p12" >> "$GITHUB_ENV"
            echo "ONCE_SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ONCE_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ONCE_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Assinatura persistente configurada."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Sem Secrets de assinatura: o APK debug não terá uma chave persistente entre execuções."
          fi

      - name: Validate, test and build APK
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          gradle lintDebug testDebugUnitTest assembleDebug \
            -PappVersionCode="$APP_VERSION_CODE" \
            -PappVersionName="$APP_VERSION_NAME"

      - name: Verify APK signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: once-in-a-while-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.enabled == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ONCE IN A WHILE ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk
